
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LOVE ESCAPE ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
 background:#142137;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
header{
 height:48px;display:flex;align-items:center;
 justify-content:space-between;padding:0 14px;
 background:#202d42;
}
header h2{color:#ff8bb9;font-size:19px}
#info{font-size:12px;color:#ffc4dd}
#stage{
 width:100vw;height:calc(100dvh - 105px);
 display:flex;align-items:center;justify-content:center;
}
canvas{
 width:100%;height:100%;object-fit:contain;
}
.controls{
 height:57px;background:#202d42;
 display:flex;align-items:center;
 justify-content:center;gap:9px;
}
button{
 border:0;border-radius:25px;padding:11px 17px;
 background:#ed5594;color:white;
 font-weight:bold;font-size:14px;
}
#musicBtn{background:#546b9b}
</style>
</head>

<body>

<header>
<h2>❤️ LOVE ESCAPE</h2>
<span id="info">READY!</span>
</header>

<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
</div>

<div class="controls">
<button onclick="startGame()">▶ START</button>
<button onclick="resetGame()">↻ RESET</button>
<button id="musicBtn" onclick="toggleMusic()">🔊 MUSIC</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const girl=new Image();
const boy=new Image();
girl.src="girl.png";
boy.src="boy.png";

let running=false;
let attacking=false;
let frame=0;
let lastTime=0;
let world=0;

let hearts=0;
let totalCatches=0;
let attackStart=0;
let attackDuration=3;

let nextHeart=0;
let heartX=960;
let heartY=260;
let heartActive=false;

let particles=[];
let audioCtx=null;
let musicOn=true;
let musicTimer=null;
let melodyStep=0;

const girlX=390;
const boyX=690;

// ---------------- AUDIO SYSTEM ----------------

function audioReady(){
 if(!audioCtx){
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 }
 if(audioCtx.state==="suspended")audioCtx.resume();
}

function tone(freq,duration,type="sine",volume=.08){
 if(!audioCtx)return;

 const osc=audioCtx.createOscillator();
 const gain=audioCtx.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(freq,audioCtx.currentTime);

 gain.gain.setValueAtTime(volume,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(
  .001,audioCtx.currentTime+duration
 );

 osc.connect(gain);
 gain.connect(audioCtx.destination);

 osc.start();
 osc.stop(audioCtx.currentTime+duration);
}

function playCollect(){
 if(!audioCtx)return;
 tone(660,.12,"sine",.09);
 setTimeout(()=>tone(880,.18,"sine",.07),90);
}

function playBonk(){
 if(!audioCtx)return;
 tone(125,.18,"square",.12);
 setTimeout(()=>tone(75,.2,"triangle",.1),100);
}

function playCatch(){
 if(!audioCtx)return;
 tone(440,.15,"sine",.09);
 setTimeout(()=>tone(330,.18,"sine",.08),120);
}

function playEscape(){
 if(!audioCtx)return;
 tone(523,.12,"sine",.08);
 setTimeout(()=>tone(659,.14,"sine",.08),100);
}

const melody=[
 392,523,587,523,
 440,523,659,587,
 392,440,523,440,
 349,440,523,392
];

function musicLoop(){
 if(!audioCtx || !musicOn || !running)return;

 const note=melody[melodyStep%melody.length];
 tone(note,.28,"triangle",.035);

 if(melodyStep%4===0){
  tone(note/2,.4,"sine",.025);
 }

 melodyStep++;
 musicTimer=setTimeout(musicLoop,330);
}

function startMusic(){
 audioReady();
 if(!musicOn || !running)return;
 clearTimeout(musicTimer);
 melodyStep=0;
 musicLoop();
}

function stopMusic(){
 clearTimeout(musicTimer);
}

function toggleMusic(){
 musicOn=!musicOn;
 document.getElementById("musicBtn").textContent=
 musicOn?"🔊 MUSIC":"🔇 MUSIC";

 if(musicOn && running)startMusic();
 else stopMusic();
}

// ---------------- BACKGROUND ----------------

function background(dt){
 world+=dt;

 let sky=ctx.createLinearGradient(0,0,0,540);
 sky.addColorStop(0,"#70c8f1");
 sky.addColorStop(.58,"#c9eddb");
 sky.addColorStop(1,"#8acb79");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,960,540);

 // Sun glow
 let glow=ctx.createRadialGradient(820,90,10,820,90,100);
 glow.addColorStop(0,"rgba(255,245,180,.7)");
 glow.addColorStop(1,"rgba(255,245,180,0)");
 ctx.fillStyle=glow;
 ctx.fillRect(700,0,240,200);

 ctx.fillStyle="#ffeaa4";
 ctx.beginPath();
 ctx.arc(820,85,40,0,Math.PI*2);
 ctx.fill();

 // Moving clouds
 for(let i=0;i<5;i++){
  let x=((i*260-world*13)%1150+1150)%1150-100;
  let y=65+(i%3)*45;

  ctx.fillStyle="rgba(255,255,255,.82)";
  ctx.beginPath();
  ctx.arc(x,y,22,0,Math.PI*2);
  ctx.arc(x+28,y-12,31,0,Math.PI*2);
  ctx.arc(x+60,y,23,0,Math.PI*2);
  ctx.fill();
 }

 // Distant hills: slow movement
 ctx.fillStyle="#8acb91";
 ctx.beginPath();
 ctx.moveTo(0,300);
 for(let x=0;x<=1000;x+=100){
  let y=240+Math.sin((x+world*8)*.009)*40;
  ctx.lineTo(x,y);
 }
 ctx.lineTo(960,400);
 ctx.lineTo(0,400);
 ctx.fill();

 // Background trees
 for(let i=0;i<8;i++){
  let x=((i*180-world*35)%1250+1250)%1250-140;
  let y=260;

  ctx.fillStyle="#795438";
  ctx.fillRect(x,y,17,100);

  ctx.fillStyle="#27894e";
  ctx.beginPath();
  ctx.arc(x+8,y-20,42,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#43ad62";
  ctx.beginPath();
  ctx.arc(x-12,y-40,25,0,Math.PI*2);
  ctx.fill();
 }

 // Ground
 ctx.fillStyle="#5ca954";
 ctx.fillRect(0,325,960,215);

 // Moving bushes
 for(let i=0;i<14;i++){
  let x=((i*95-world*65)%1100+1100)%1100-80;
  ctx.fillStyle=i%2?"#328b49":"#439c52";
  ctx.beginPath();
  ctx.arc(x,345,20,Math.PI,Math.PI*2);
  ctx.fill();
 }

 // Road
 ctx.fillStyle="#d9bd91";
 ctx.fillRect(0,380,960,160);

 ctx.strokeStyle="#f5e5c8";
 ctx.lineWidth=5;
 ctx.beginPath();
 ctx.moveTo(0,382);
 ctx.lineTo(960,382);
 ctx.stroke();

 // Moving road markings
 ctx.fillStyle="#fff0d1";
 for(let i=0;i<9;i++){
  let x=((i*150-world*230)%1100+1100)%1100-100;
  ctx.fillRect(x,455,65,7);
 }

 // Moving flowers
 for(let i=0;i<18;i++){
  let x=((i*75-world*95)%1100+1100)%1100-70;
  let y=350+(i%3)*10;

  ctx.fillStyle=i%2?"#ffdf73":"#ff9bc4";
  ctx.beginPath();
  ctx.arc(x,y,5,0,Math.PI*2);
  ctx.fill();
 }
}

// ---------------- CHARACTERS ----------------

function drawCharacter(img,x,y,w,h,phase,rotation=0){
 ctx.save();
 ctx.translate(x,y);

 // Shadow
 ctx.fillStyle="rgba(0,0,0,.2)";
 ctx.beginPath();
 ctx.ellipse(0,0,w*.34,10,0,0,Math.PI*2);
 ctx.fill();

 ctx.rotate(rotation);

 let bob=Math.sin(phase)*5;

 if(img.complete && img.naturalWidth>0){
  ctx.drawImage(img,-w/2,-h+bob,w,h);
 }else{
  ctx.fillStyle=img===girl?"#ed75a8":"#4686d9";
  ctx.fillRect(-w/2,-h+bob,w,h);
  ctx.fillStyle="white";
  ctx.font="bold 22px Arial";
  ctx.textAlign="center";
  ctx.fillText(img===girl?"GIRL":"BOY",0,-h/2+bob);
 }

 ctx.restore();
}

// ---------------- HEARTS ----------------

function drawHeart(x,y){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(1.1,1.1);

 ctx.fillStyle="#ff347e";
 ctx.beginPath();
 ctx.moveTo(0,12);
 ctx.bezierCurveTo(-45,-12,-25,-40,0,-19);
 ctx.bezierCurveTo(25,-40,45,-12,0,12);
 ctx.fill();

 ctx.restore();
}

// ---------------- PARTICLES ----------------

function createParticles(x,y,color){
 for(let i=0;i<14;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*6,
   vy:(Math.random()-.5)*6,
   life:1,
   size:Math.random()*5+2,
   color
  });
 }
}

function updateParticles(dt){
 particles.forEach(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.life-=dt*1.5;
 });

 particles=particles.filter(p=>p.life>0);
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=p.life;
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 });
}

// ---------------- GAME LOGIC ----------------

function catchBoy(){
 if(attacking)return;

 attacking=true;
 totalCatches++;

 // 3, 5, 7, 9, 11...
 attackDuration=3+(totalCatches-1)*2;
 attackStart=performance.now();

 playCatch();
 createParticles(550,250,"#ffcf48");

 document.getElementById("info").textContent=
 "🧹 ATTACK "+attackDuration+" SEC!";
}

function startGame(){
 if(running)return;

 running=true;
 audioReady();

 lastTime=performance.now();
 nextHeart=performance.now()+1000;

 document.getElementById("info").textContent="🏃 RUNNING!";

 if(musicOn)startMusic();
}

function resetGame(){
 running=false;
 attacking=false;

 stopMusic();

 hearts=0;
 totalCatches=0;
 attackDuration=3;
 heartActive=false;
 particles=[];
 frame=0;
 world=0;

 document.getElementById("info").textContent="READY!";
}

// ---------------- UPDATE ----------------

function update(dt,now){
 if(!running)return;

 frame+=dt*9;

 if(attacking){
  let elapsed=(now-attackStart)/1000;

  // Repeated broom-hit sound rhythm
  if(elapsed<attackDuration &&
     Math.floor(elapsed*2)!==Math.floor((elapsed-dt)*2)){
   playBonk();
   createParticles(570,240,"#ffdf61");
  }

  if(elapsed>=attackDuration){
   attacking=false;
   hearts=0;
   heartActive=false;

   playEscape();

   document.getElementById("info").textContent="🏃 BOY ESCAPED!";
  }
  return;
 }

 // Heart spawning
 if(!heartActive && now>=nextHeart){
  heartActive=true;
  heartX=960;
  heartY=250+Math.random()*70;
 }

 if(heartActive){
  heartX-=300*dt;

  if(heartX<=girlX+45 && heartX>=girlX-65){
   hearts++;
   heartActive=false;
   nextHeart=now+800;

   playCollect();
   createParticles(girlX,260,"#ff4d91");

   if(hearts>=12){
    catchBoy();
   }
  }

  if(heartX<0){
   heartActive=false;
   nextHeart=now+500;
  }
 }
}

// ---------------- RENDER ----------------

function render(now){
 let dt=Math.min((now-lastTime)/1000,.04);
 lastTime=now;

 if(running)update(dt,now);
 updateParticles(dt);

 background(running?dt:0);

 // Heart
 if(heartActive && !attacking){
  drawHeart(heartX,heartY);
 }

 if(attacking){
  let elapsed=(now-attackStart)/1000;
  let progress=elapsed/attackDuration;

  // Boy flinches
  let boyShake=Math.sin(elapsed*22)*10;
  let boyRotation=Math.sin(elapsed*14)*.13;

  drawCharacter(
   boy,boyX+boyShake,370,115,180,frame,boyRotation
  );

  // Girl uses broom already present in her picture
  let swing=Math.sin(elapsed*18)*.32;
  let recoil=Math.sin(elapsed*30)*.045;

  drawCharacter(
   girl,480,370,125,190,
   frame+elapsed*5,swing+recoil
  );

  ctx.fillStyle="#ffdf61";
  ctx.font="bold 32px Arial";
  ctx.textAlign="center";
  ctx.fillText("BONK! 💥",550,145);

  // Attack timer
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(350,45,260,17);

  ctx.fillStyle="#ff69a7";
  ctx.fillRect(
   350,45,
   260*Math.max(0,1-progress),17
  );

  ctx.fillStyle="white";
  ctx.font="bold 20px Arial";
  ctx.fillText(
   Math.max(0,attackDuration-elapsed).toFixed(1)+" SEC",
   480,32
  );

 }else{
  drawCharacter(boy,boyX,370,115,180,frame);
  drawCharacter(girl,girlX,370,125,190,frame);
 }

 drawParticles();

 // Score
 ctx.textAlign="left";
 ctx.font="bold 24px Arial";
 ctx.fillStyle="white";
 ctx.fillText("❤️ LOVE: "+hearts+"/12",25,45);

 ctx.font="17px Arial";
 ctx.fillText("CATCH: "+totalCatches,25,75);

 requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>

</body>
</html>
